name: Tests

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-tests.yml@main
        with:
            # Not PHP 8.5 yet: The Events Calendar raises PHP 8.5 deprecations
            # (SplObjectStorage::contains()), which the suite turns into errors.
            php-versions: '["8.2","8.3","8.4"]'
            js-unit: true
            js-lint: true
            check-dist: true
            # Not yet: phpcs (WPCS 3) still reports existing violations.
            php-lint: false
