name: Build Release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    release:
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-release.yml@main
        with:
            version-files: |
                src/Plugin.php
            # Ship the production vendor/ (runtime Composer dependencies) in the ZIP.
            composer: true
