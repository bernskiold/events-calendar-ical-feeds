name: Create Release
on:
    workflow_dispatch:
        inputs:
            versionName:
                description: 'Version (ie 5.5.0)'
                required: true

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-latest
        steps:
        
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  
            - name: Modify Main Plugin File
              uses: mingjun97/file-regex-replace@v1
              with:
                  regex: 'Version:(\s+)(.+)'
                  replacement: 'Version:$1${{ github.event.inputs.versionName }}'
                  include: '${{ github.event.repository.name}}\.php'
                  
            - name: Modify Main Plugin Class
              uses: mingjun97/file-regex-replace@v1
              with:
                  regex: "version(\\s*\\t*)= '(.*)';"
                  replacement: "version$1= '${{ github.event.inputs.versionName }}';"
                  include: 'src/Plugin\.php'
            
            - name: Set up PHP
              # php-scoper (dev-master from 2021) turns the deprecations of PHP 8.1+
              # into fatal errors, so build on the plugin's minimum PHP version.
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '7.4'
                  tools: composer:v2

            - name: Build
              run: composer run release
              
            - name: Commit
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  branch: main
                  commit_message: "Prepare release ${{ github.event.inputs.versionName }}"
                  
            - name: Release
              uses: softprops/action-gh-release@v1
              with:
                  draft: true
                  prerelease: false
                  name: ${{ github.event.inputs.versionName }}
                  tag_name: ${{ github.event.inputs.versionName }}
                  generate_release_notes: true
