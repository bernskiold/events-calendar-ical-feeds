# Tells packages.bernskiold.com to rebuild its Satis index when this package
# publishes a new version.
name: Notify Satis

on:
    push:
        tags: ["*"]
    release:
        types: [published]
    # The release workflow moves the tag with GITHUB_TOKEN, which never fires
    # `push: tags`. This catches the final, version-bumped commit.
    workflow_run:
        workflows: ["Build Release"]
        types: [completed]
    workflow_dispatch:

permissions: {}

jobs:
    notify:
        name: Notify Satis
        uses: bernskiold/.github/.github/workflows/satis-notify.yml@main
        secrets: inherit
